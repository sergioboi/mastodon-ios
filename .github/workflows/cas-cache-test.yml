name: CAS cache test

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Cache mode to test
        type: choice
        required: true
        default: local
        options:
          - local
          - remote
      clear_local_cache_dir:
        description: Clear .ci/cas-build-cache before cold local-cache builds
        type: boolean
        required: true
        default: true

jobs:
  cas-cache-test:
    name: CAS cache build tests and verify
    runs-on: macos-15
    env:
      CACHE_MODE: ${{ inputs.cache_mode }}
      CLEAR_LOCAL_CACHE_DIR: ${{ inputs.clear_local_cache_dir }}
      FASTLANE_LANE: build_tests
      PROJECT: Mastodon.xcodeproj
      SCHEME: Mastodon
      TEST_PLAN: Mastodon
      DESTINATION: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2"
      DERIVED_DATA_PATH: ${{ github.workspace }}/build_2/DerivedData

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - name: Repository
        uses: actions/checkout@v6

      - name: Setup Build Environment
        env:
          NotificationEndpointDebug: ${{ secrets.NotificationEndpointDebug }}
          NotificationEndpointRelease: ${{ secrets.NotificationEndpointRelease }}
        run: exec ./.github/scripts/setup.sh

      - name: Select required Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app

      - name: Install CASBuildCache
        if: ${{ inputs.cache_mode == 'local' }}
        run: exec ./.github/scripts/install-cas-build-cache.sh

      - name: Install xcodecacheprog
        run: exec ./.github/scripts/install-xcodecacheprog.sh

      - name: Build tests without cache
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "false"
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/build-for-testing.sh

      - name: Clean before second no-cache build
        run: |
          xcodebuild clean \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination "${DESTINATION}"
          rm -rf "${DERIVED_DATA_PATH}"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: Build tests without cache after clean
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "false"
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/build-for-testing.sh

      - name: Test second no-cache build
        run: |
          XCTESTRUN_PATH="$(find "${DERIVED_DATA_PATH}/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          if [[ -z "${XCTESTRUN_PATH}" ]]; then
            echo "No .xctestrun file found under ${DERIVED_DATA_PATH}/Build/Products" >&2
            exit 1
          fi

          xcodecacheprog test \
            --xctestrun "${XCTESTRUN_PATH}" \
            --destination "${DESTINATION}" \
            --ignore-non-cacheable

      - name: Ensure cached build starts without local CAS data when requested
        run: |
          if [[ "${CACHE_MODE}" == "local" && "${CLEAR_LOCAL_CACHE_DIR}" == "true" ]]; then
            rm -rf .ci/cas-build-cache
          else
            echo "Skipping local CAS cache directory cleanup"
          fi

      - name: Clean before cached build
        run: |
          xcodebuild clean \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination "${DESTINATION}"
          rm -rf "${DERIVED_DATA_PATH}"
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: Build tests with cache enabled
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "true"
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/build-for-testing.sh

      - name: Show warmed cache
        if: ${{ inputs.cache_mode == 'local' }}
        run: |
          du -sh .ci/cas-build-cache
          find .ci/cas-build-cache -maxdepth 2 -type f | head -n 30

      - name: Test cached build
        run: |
          XCTESTRUN_PATH="$(find "${DERIVED_DATA_PATH}/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          if [[ -z "${XCTESTRUN_PATH}" ]]; then
            echo "No .xctestrun file found under ${DERIVED_DATA_PATH}/Build/Products" >&2
            exit 1
          fi

          xcodecacheprog test \
            --xctestrun "${XCTESTRUN_PATH}" \
            --destination "${DESTINATION}" \
            --ignore-non-cacheable
