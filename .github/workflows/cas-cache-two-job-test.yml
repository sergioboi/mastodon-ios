name: CAS cache two-job test

on:
  workflow_dispatch:

jobs:
  cas-cache-test:
    name: CAS cache warm and verify
    runs-on: macos-15

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - name: Repository
        uses: actions/checkout@v6

      - name: Setup Build Environment
        env:
          NotificationEndpointDebug: ${{ secrets.NotificationEndpointDebug }}
          NotificationEndpointRelease: ${{ secrets.NotificationEndpointRelease }}
        run: exec ./.github/scripts/setup.sh

      - name: Select required Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app

      - name: Build without CAS cache
        run: |
          xcodebuild clean build \
            -project Mastodon.xcodeproj \
            -scheme Mastodon \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro"

      - name: Install CASBuildCache
        run: exec ./.github/scripts/install-cas-build-cache.sh

      - name: Ensure warm build starts without CAS data
        run: rm -rf .ci/cas-build-cache

      - name: Clean DerivedData before warm build
        run: rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: Clean Xcode build products before warm build
        run: |
          xcodebuild clean \
            -project Mastodon.xcodeproj \
            -scheme Mastodon \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro"

      - name: Build with empty CAS to warm cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/XcodeCache.xcconfig
        run: exec ./.github/scripts/run-cas-cached-build.sh

      - name: Show warmed cache
        run: |
          du -sh .ci/cas-build-cache
          find .ci/cas-build-cache -maxdepth 2 -type f | head -n 30

      - name: Clean DerivedData before warmed build
        run: rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: Clean Xcode build products before warmed build
        run: |
          xcodebuild clean \
            -project Mastodon.xcodeproj \
            -scheme Mastodon \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro"

      - name: Build with warmed CAS cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/XcodeCache.xcconfig
        run: exec ./.github/scripts/run-cas-cached-build.sh
