name: Xcode cache build

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Cache mode to test
        type: choice
        required: true
        default: remote
        options:
          - remote

jobs:
  cas-cache-test:
    name: Xcode cache build
    runs-on: macos-15
    env:
      CACHE_MODE: ${{ inputs.cache_mode }}
      FASTLANE_LANE: build_only

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - name: Repository
        uses: actions/checkout@v6

      - name: Setup Build Environment
        env:
          NotificationEndpointDebug: ${{ secrets.NotificationEndpointDebug }}
          NotificationEndpointRelease: ${{ secrets.NotificationEndpointRelease }}
        run: exec ./.github/scripts/setup.sh

      - name: Select required Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_26.2.app

      - name: Install xcodecacheprog
        env:
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/install-xcodecacheprog.sh

      - name: Remove local build state
        run: |
          rm -rf build/DerivedData
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: "build `${{ env.FASTLANE_LANE }}` without cache"
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "false"
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/build-for-testing.sh

      - name: Remove local build state
        run: |
          rm -rf build/DerivedData
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: "build `${{ env.FASTLANE_LANE }}` without cache"
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "false"
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/.github/support/XcodeNoCache.xcconfig
        run: exec ./.github/scripts/build-for-testing.sh

      - name: Remove local build state
        run: |
          rm -rf build/DerivedData
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: "build `${{ env.FASTLANE_LANE }}` with ${{ inputs.cache_mode }} cache"
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "true"
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/build-for-testing.sh

      - name: Remove local build state
        run: |
          rm -rf build/DerivedData
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData"

      - name: "build `${{ env.FASTLANE_LANE }}`  with ${{ inputs.cache_mode }} cache"
        env:
          ENABLE_XCODE_COMPILATION_CACHE: "true"
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec ./.github/scripts/build-for-testing.sh
